name: release

# Builds desktop clients for Windows / Linux / macOS and publishes them as a
# GitHub Release. Push a version tag (v1.2.0) to ship; a manual run only
# builds and uploads the artifacts to the workflow run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  build:
    name: build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Both desktop targets are required for a complete release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            sep: ";"
          - os: ubuntu-latest
            platform: linux-x64
            sep: ":"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0
      - run: pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ModelLabeling
          --add-data "icons${{ matrix.sep }}icons"
          app.py
      - name: Package
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "${GITHUB_REF_NAME}" ] && VERSION="dev-${GITHUB_RUN_NUMBER}"
          mkdir -p staging
          cp dist/ModelLabeling* staging/
          cp -r icons staging/
          cp README.md staging/
          ASSET="ModelLabeling-${VERSION}-${{ matrix.platform }}"
          # python's zipfile works on every runner (no external zip needed)
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'staging')" "${ASSET}"
          echo "ASSET=${ASSET}.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
